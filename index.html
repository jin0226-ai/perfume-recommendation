      <div style="font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 40px 20px; line-height: 1.7; color: #333;">
        <h1 style="font-size: 2rem; color: #7c3aed;">Scent Match - AI 향수 추천 서비스</h1>
        <p style="font-size: 1.1rem; color: #555;">사진 한 장으로 나에게 어울리는 향수를 찾아보세요. 이미지 색상 분석 기술로 당신의 분위기에 맞는 니치 향수를 추천해드립니다.</p>

        <h2 style="font-size: 1.4rem; margin-top: 2rem;">서비스 소개</h2>
        <p>Scent Match는 색상 심리학과 이미지 분석 기술을 활용하여 사진 속 분위기를 파악하고, 그에 맞는 니치 향수를 추천하는 무료 서비스입니다. 수많은 향수 중에서 나에게 어울리는 향을 찾기 어려운 분들을 위해 만들어졌습니다.</p>

        <h2 style="font-size: 1.4rem; margin-top: 2rem;">주요 기능</h2>
        <ul style="padding-left: 1.5rem;">
          <li><strong>이미지 분석:</strong> 사진의 색상 톤, 채도, 명도를 분석하여 분위기(바이브)를 파악합니다.</li>
          <li><strong>취향 퀴즈:</strong> 6가지 질문을 통해 나만의 향수 취향을 분석합니다.</li>
          <li><strong>향료 선택:</strong> 좋아하는 향료를 직접 선택하여 맞춤 향수를 추천받습니다.</li>
        </ul>

        <h2 style="font-size: 1.4rem; margin-top: 2rem;">추천 향수 브랜드</h2>
        <p>Maison Francis Kurkdjian, Diptyque, Le Labo, Byredo, Jo Malone, Tom Ford, 탬버린즈, 912 퍼퓸 등 세계적인 니치 향수 브랜드와 국내 브랜드의 엄선된 향수를 추천합니다.</p>

        <h2 style="font-size: 1.4rem; margin-top: 2rem;">5가지 분위기 카테고리</h2>
        <ul style="padding-left: 1.5rem;">
          <li><strong>Elegant (우아함):</strong> 차분하고 세련된 분위기. 파우더리·머스크 계열 향수.</li>
          <li><strong>Sporty (활동적):</strong> 밝고 에너지 넘치는 분위기. 시트러스·그린 계열 향수.</li>
          <li><strong>Romantic (로맨틱):</strong> 부드럽고 사랑스러운 분위기. 플로럴·프루티 계열 향수.</li>
          <li><strong>Modern (모던):</strong> 도시적이고 세련된 분위기. 우디·앰버 계열 향수.</li>
          <li><strong>Intense (강렬함):</strong> 깊고 강렬한 분위기. 스파이시·오리엔탈 계열 향수.</li>
        </ul>

        <p style="margin-top: 2rem; color: #888; font-size: 0.9rem;">이 서비스를 이용하려면 JavaScript를 활성화해주세요.</p>

<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e8ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9333ea" />
      <stop offset="50%" style="stop-color:#db2777" />
      <stop offset="100%" style="stop-color:#2563eb" />
    </linearGradient>
    <linearGradient id="bottleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc" />
      <stop offset="100%" style="stop-color:#9333ea" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#c084fc" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#f472b6" opacity="0.1"/>
  <circle cx="900" cy="100" r="100" fill="#60a5fa" opacity="0.1"/>

  <!-- Perfume bottle icon -->
  <g transform="translate(150, 200)">
    <!-- Bottle body -->
    <rect x="30" y="80" width="100" height="150" rx="10" fill="url(#bottleGradient)" opacity="0.9"/>
    <!-- Bottle neck -->
    <rect x="55" y="40" width="50" height="45" rx="5" fill="#a855f7"/>
    <!-- Bottle cap -->
    <rect x="50" y="10" width="60" height="35" rx="8" fill="#7c3aed"/>
    <!-- Spray mist -->
    <circle cx="80" cy="0" r="8" fill="#c084fc" opacity="0.6"/>
    <circle cx="60" cy="-15" r="5" fill="#c084fc" opacity="0.4"/>
    <circle cx="100" cy="-10" r="6" fill="#c084fc" opacity="0.5"/>
    <circle cx="75" cy="-25" r="4" fill="#c084fc" opacity="0.3"/>
    <!-- Bottle shine -->
    <rect x="40" y="100" width="15" height="80" rx="5" fill="white" opacity="0.3"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="90" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">
    Scent Match
  </text>

  <!-- Subtitle -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="#6b7280">
    AI 향수 추천 서비스
  </text>

  <!-- Description -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#9ca3af">
    사진 한 장으로 나에게 어울리는 향수를 찾아보세요
  </text>

  <!-- Feature badges -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="#9333ea" opacity="0.1"/>
    <text x="75" y="27" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#9333ea">이미지 분석</text>
  </g>
  <g transform="translate(480, 480)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="#db2777" opacity="0.1"/>
    <text x="75" y="27" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#db2777">니치 향수</text>
  </g>
  <g transform="translate(660, 480)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="#2563eb" opacity="0.1"/>
    <text x="75" y="27" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2563eb">무료 서비스</text>
  </g>

  <!-- URL -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#9ca3af">
    randomasset.netlify.app
  </text>
</svg>

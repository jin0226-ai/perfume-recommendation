<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc" />
      <stop offset="100%" style="stop-color:#9333ea" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7" />
      <stop offset="100%" style="stop-color:#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Bottle body -->
  <rect x="8" y="14" width="16" height="16" rx="3" fill="url(#bottleGrad)"/>

  <!-- Bottle neck -->
  <rect x="11" y="8" width="10" height="7" rx="2" fill="#a855f7"/>

  <!-- Bottle cap -->
  <rect x="10" y="2" width="12" height="7" rx="2" fill="url(#capGrad)"/>

  <!-- Shine effect -->
  <rect x="10" y="16" width="3" height="10" rx="1" fill="white" opacity="0.3"/>

  <!-- Spray dots -->
  <circle cx="16" cy="0" r="1.5" fill="#c084fc" opacity="0.7"/>
  <circle cx="12" cy="-1" r="1" fill="#c084fc" opacity="0.5"/>
  <circle cx="20" cy="0" r="1" fill="#c084fc" opacity="0.5"/>
</svg>
